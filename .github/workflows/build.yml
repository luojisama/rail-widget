name: Android CI / Build APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test RailWidget APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Print lint errors
        if: always()
        run: |
          python3 - <<'PYLINT'
          import pathlib, xml.etree.ElementTree as ET
          path = pathlib.Path('app/build/reports/lint-results-debug.xml')
          if path.exists():
              for issue in ET.parse(path).findall('issue'):
                  if issue.get('severity') in ('Error', 'Fatal'):
                      print(issue.attrib)
                      for location in issue.findall('location'):
                          print(location.attrib)
          PYLINT

      - name: Public train source smoke check
        if: always()
        run: python3 scripts/check_train_sources.py

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RailCard-Reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/source-smoke.json
          retention-days: 14

      - name: Build RailCard APK
        run: ./gradlew assembleDebug

      - name: Upload RailCard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailCard-1.3.0-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

